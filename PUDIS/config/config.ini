[Paths]
; Root folder where all PUDIS operations occur on the target drive
Root=PUDIS

; Subdirectories relative to Root
Bin=bin
Scripts=scripts
Data=data
Reports=reports

; Status and metadata files
StatusXML=Drive_Status.xml
BaselineXML=data\baseline.xml
CurrentCheck=data\current_check.xml

; Logging and help files
Logs=logs
Help=Help.html
config=config\config.ini
Par2log=logs\par2.log
FileListGenErrors=logs\FileListGenErrors.log

; Surface scan error log (new)
; Centralized location for surface_scan logging output
SurfaceScanErrors=logs\SurfaceScan.log


[Behavior]
; Automatically refresh device info after operations
AutoRefreshDeviceInfo=1

; Reload UI after a scan completes
AutoReloadAfterScan=1

; Temperature warnings
WarnOnHighTemp=1
CriticalTemp=60        ; °C — abort or warn at this temperature
WarningTemp=55         ; °C — show caution indicator


[Logging]
; Global logging level for the suite (used by multiple modules)
LoggingLevel=1

; Enable logging for PAR2 operations
EnablePar2Logging=1

; --- Surface Scan Logging (new, module-specific) ---
SurfaceScanLogging=1                   ; Enable/disable logging for surface_scan
SurfaceScanLogMode=append              ; append | overwrite | rotate
SurfaceScanMaxLogSizeMB=5              ; Used only when rotate mode is active
SurfaceScanLogLevel=info               ; error | warn | info | debug
SurfaceScanLogTemperature=1            ; Log SMART temperature (if available)
SurfaceScanLogIOErrors=1               ; Log I/O failures (CRC, device errors)
SurfaceScanLogUSBResets=1              ; Log USB disconnect/reset events
SurfaceScanLogFilesystemState=1        ; Log NTFS→RAW transitions, path failures
SurfaceScanLogProgressInterval=5       ; 0=off, otherwise log every N% progress


[Permissions]
; Require admin privileges for operations that need raw disk access
RequireAdmin=1
;RequireAdmin=0


[UI]
; Console window size
WindowWidth=69
WindowHeight=46

; Title bar text
Title=Portable USB Drive Integrity Suite 2.0

; Default console color (background+foreground)
Color=0F

; --- PUDIS Global Color Palette ---
; Use standard color names or Hex values (#55ff55)

; Header and structural elements
TitleColor=Cyan
SeparatorColor=Blue
MenuColor=Magenta
FooterColor=Purple

; Labels and values
LabelColor=Green
ValueColor=White
InfoColor=Gray

; Status indicators
StatusOKColor=#55ff55
WarningColor=Yellow
ErrorColor=Red
ResetColor=White


[Performance]
; Physical drive performance characteristics (measured during calibration)
DriveType=1
MeasuredSequentialReadMBps=132.7
MeasuredSustainedReadMBps=122.1
MeasuredRandomReadIOPS=1126.5
MeasuredAccessLatencyMS=0.89
SmallFileEfficiency=0.033
MeasuredSustainedWriteMBps=33.9


[BusCharacteristics]
; USB/SATA/NVMe bus behavior and overhead
InterfaceType=USB_FLASH_STICK
MeasuredBusLatencyMS=1.20
ProtocolOverheadFactor=0.12
BusSaturationLimitMBps=480.0
ClusterSize=4096


[Compute]
; Host system compute characteristics (used for estimators)
MD5_ProcessingRate_MBps=680.9
XML_SerializationRate_MBps=306.4
ThreadEfficiencyFactor=0.85
PowerThrottlingActive=0


[Tuning]
; Weighted multipliers for time estimators
BaselineReadPenalty=0.310
ParityPenalty=0.200
HDD_BaselinePenalty=0.450
HDD_ParityPenalty=0.380

; Minimum and baseline recovery times
MinRecoverySeconds=300
RecoveryFloorBase=600
RecoveryFloorMultiplier=1.25

; Per-file overhead and tuning factor
PerFileOverheadMS=4.94
ScanTimeEstimateTuning=1.000


[Par2Settings]
; PAR2 block size (4MB recommended for large file sets)
BlockSize=4194304

; Memory limit for PAR2 operations (MB)
MemoryLimit=2048

; Number of worker threads
Threads=8

; Number of files to hash in parallel
ParallelHashing=4

; Redundancy percentage for PAR2 recovery files
Redundancy=10


[FileSystemProfile]
; Snapshot of the target filesystem (used for estimators)
TotalFiles=18201
TotalBytes=12095307895
AverageFileSize=664541
SmallFileRatio=0.832
DirectoryCount=2505
MaxDepth=13


[Restrictions]
; Safety locks to prevent dangerous operations
BlockSystemDrive=1
BlockDriveLetters=C
LargeDriveWarning=0


[Scan]
; User-defined scan depth preferences
QuickSurfaceSamplePercent=10
FullSurfaceSamplePercent=100
AllowFullScanOnSSD=0
AllowScanNonUSB=0

; Cooldown delay in milliseconds after writing each test file block
; Lower values (0-10) maximize speed but can freeze Windows Explorer on slower drives.
; Higher values (25-50) keep the OS responsive but make the scan take longer.
WriteCooldownMS=0


[Exclusions]
; Folders and file prefixes to skip during scans
Folders=PUDIS;System Volume Information;$RECYCLE.BIN
FilePrefixes=~$

; Maximum allowed path length
MaxPathLength=245

; Characters that invalidate a path or filename
PoisonChars=|^%><


[Tools]
; Executable names for each module in the suite
BaselineEstimator=baselineXML_estimate.exe
CalibrateHardware=calibrate_hardware.exe
Corruptor=corruptor.exe
CreateBaselineXML=create_baselineXML.exe
CreateRecovery=create_recovery.exe
CreateRecoveryEstimate=create_recovery_estimate.exe
DeviceInfo=deviceinfo.exe
FileListGen=FileListGen.exe
FullProbe=full_probe.exe
GenerateReport=generate_report.exe
HashDeep=hashdeep64.exe
Par2=par2.exe
QuickFileCheck=quick_file_check.exe
RecoveryEstimate=recovery_estimate.exe
ScanTimeEstimate=scantime_estimate.exe
SmartCtl=smartctl.exe
SurfaceScan=surface_scan.exe


[Browser]
; Browser selection:
;   default  = system default
;   edge     = Microsoft Edge
;   chrome   = Google Chrome
;   firefox  = Mozilla Firefox
;   brave    = Brave
;   <path>   = custom browser executable
Browser=edge

; Browser window size (for HTML reports)
WindowWidth=800
WindowHeight=600

; WindowedMode options: 
; 1 = App Mode (Clean, borderless window constrained to Width/Height)
; 0 = Normal Mode (Standard browser window/tab, ignores Width/Height if already running)
WindowedMode=0
